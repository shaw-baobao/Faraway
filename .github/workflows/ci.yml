name: macOS build and tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show Swift version
        run: swift --version
      - name: Run unit tests
        run: swift test
      - name: Build application
        run: ./scripts/build.sh
      - name: Verify application bundle
        run: |
          codesign --verify --deep --strict dist/Faraway.app
          plutil -lint dist/Faraway.app/Contents/Info.plist
